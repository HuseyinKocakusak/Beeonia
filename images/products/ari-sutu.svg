<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Dark background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="55%" r="60%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <!-- Jar glass gradient -->
    <linearGradient id="jarGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.03)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.08)"/>
    </linearGradient>
    <!-- Royal jelly content - creamy white/pearl -->
    <linearGradient id="royalJellyContent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5edd6"/>
      <stop offset="25%" stop-color="#efe3c4"/>
      <stop offset="50%" stop-color="#e8d9b2"/>
      <stop offset="75%" stop-color="#e0d0a5"/>
      <stop offset="100%" stop-color="#d8c898"/>
    </linearGradient>
    <!-- Royal jelly highlight -->
    <radialGradient id="jellySheen" cx="40%" cy="30%" r="50%">
      <stop offset="0%" stop-color="rgba(255,250,235,0.4)"/>
      <stop offset="100%" stop-color="rgba(255,250,235,0)"/>
    </radialGradient>
    <!-- Cap gradient - rich gold -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4a84b"/>
      <stop offset="30%" stop-color="#b8922e"/>
      <stop offset="70%" stop-color="#9a7a20"/>
      <stop offset="100%" stop-color="#8a6c18"/>
    </linearGradient>
    <!-- Cap top gradient -->
    <linearGradient id="capTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0b85a"/>
      <stop offset="50%" stop-color="#b8922e"/>
      <stop offset="100%" stop-color="#d4a84b"/>
    </linearGradient>
    <!-- Label gradient -->
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1820"/>
      <stop offset="50%" stop-color="#0d0c12"/>
      <stop offset="100%" stop-color="#1a1820"/>
    </linearGradient>
    <!-- Surface shadow -->
    <radialGradient id="surfaceShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.5)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <!-- Geometric pattern clip -->
    <clipPath id="labelClip">
      <rect x="235" y="370" width="330" height="190" rx="4"/>
    </clipPath>
    <!-- Sparkle filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>

  <!-- Subtle surface/table -->
  <ellipse cx="400" cy="680" rx="350" ry="30" fill="url(#surfaceShadow)"/>
  <rect x="50" y="665" width="700" height="2" fill="#1a1a1a" opacity="0.4"/>

  <!-- === JAR BODY === -->
  <!-- Shadow under jar -->
  <ellipse cx="400" cy="660" rx="160" ry="20" fill="rgba(0,0,0,0.6)"/>

  <!-- Main jar body shape -->
  <path d="M260,350
           Q255,400 258,500
           Q260,580 270,620
           Q290,660 400,665
           Q510,660 530,620
           Q540,580 542,500
           Q545,400 540,350 Z"
        fill="url(#royalJellyContent)"/>

  <!-- Creamy jelly sheen overlay -->
  <path d="M260,350
           Q255,400 258,500
           Q260,580 270,620
           Q290,660 400,665
           Q510,660 530,620
           Q540,580 542,500
           Q545,400 540,350 Z"
        fill="url(#jellySheen)"/>

  <!-- Glass overlay -->
  <path d="M260,350
           Q255,400 258,500
           Q260,580 270,620
           Q290,660 400,665
           Q510,660 530,620
           Q540,580 542,500
           Q545,400 540,350 Z"
        fill="url(#jarGlass)"/>

  <!-- Creamy texture swirl lines -->
  <path d="M290,400 Q350,395 410,405 Q470,415 520,400"
        fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <path d="M280,440 Q340,450 400,438 Q460,426 530,445"
        fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <path d="M285,480 Q360,470 420,482 Q480,494 535,478"
        fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Glass edge highlight left -->
  <path d="M265,360
           Q260,420 263,500
           Q264,560 272,610"
        fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Glass edge highlight right -->
  <path d="M535,360
           Q541,420 538,500
           Q536,560 528,610"
        fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>

  <!-- Royal jelly surface sheen -->
  <ellipse cx="400" cy="355" rx="137" ry="15" fill="rgba(255,250,230,0.25)"/>

  <!-- Glass reflection band -->
  <path d="M310,360
           Q308,420 310,520
           Q312,580 320,620"
        fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="20" opacity="0.5"/>

  <!-- Small glass highlight spot -->
  <ellipse cx="330" cy="400" rx="12" ry="25" fill="rgba(255,255,255,0.18)" transform="rotate(-10,330,400)"/>

  <!-- === JAR NECK === -->
  <path d="M310,350 Q310,310 315,290 L485,290 Q490,310 490,350"
        fill="#e8d9b2"/>
  <path d="M310,350 Q310,310 315,290 L485,290 Q490,310 490,350"
        fill="url(#jarGlass)"/>

  <!-- Neck thread ridges -->
  <line x1="312" y1="305" x2="488" y2="305" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <line x1="313" y1="315" x2="487" y2="315" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="311" y1="325" x2="489" y2="325" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- === CAP === -->
  <!-- Cap body -->
  <rect x="295" y="250" width="210" height="50" rx="8" fill="url(#capGrad)"/>
  <!-- Cap top -->
  <ellipse cx="400" cy="252" rx="105" ry="12" fill="url(#capTop)"/>
  <!-- Cap ridges -->
  <g opacity="0.2">
    <line x1="310" y1="260" x2="310" y2="295" stroke="white" stroke-width="0.5"/>
    <line x1="320" y1="258" x2="320" y2="296" stroke="white" stroke-width="0.5"/>
    <line x1="330" y1="256" x2="330" y2="297" stroke="white" stroke-width="0.5"/>
    <line x1="340" y1="255" x2="340" y2="298" stroke="white" stroke-width="0.5"/>
    <line x1="350" y1="254" x2="350" y2="298" stroke="white" stroke-width="0.5"/>
    <line x1="360" y1="253" x2="360" y2="299" stroke="white" stroke-width="0.5"/>
    <line x1="370" y1="253" x2="370" y2="299" stroke="white" stroke-width="0.5"/>
    <line x1="380" y1="252" x2="380" y2="299" stroke="white" stroke-width="0.5"/>
    <line x1="390" y1="252" x2="390" y2="299" stroke="white" stroke-width="0.5"/>
    <line x1="400" y1="252" x2="400" y2="299" stroke="white" stroke-width="0.5"/>
    <line x1="410" y1="252" x2="410" y2="299" stroke="white" stroke-width="0.5"/>
    <line x1="420" y1="252" x2="420" y2="299" stroke="white" stroke-width="0.5"/>
    <line x1="430" y1="253" x2="430" y2="299" stroke="white" stroke-width="0.5"/>
    <line x1="440" y1="253" x2="440" y2="299" stroke="white" stroke-width="0.5"/>
    <line x1="450" y1="254" x2="450" y2="298" stroke="white" stroke-width="0.5"/>
    <line x1="460" y1="255" x2="460" y2="298" stroke="white" stroke-width="0.5"/>
    <line x1="470" y1="256" x2="470" y2="297" stroke="white" stroke-width="0.5"/>
    <line x1="480" y1="258" x2="480" y2="296" stroke="white" stroke-width="0.5"/>
    <line x1="490" y1="260" x2="490" y2="295" stroke="white" stroke-width="0.5"/>
  </g>
  <!-- Cap highlight -->
  <line x1="310" y1="265" x2="310" y2="290" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- === CAP LOGO === -->
  <text x="400" y="248" text-anchor="middle" fill="#fff8e0" font-family="serif" font-size="11" letter-spacing="3" opacity="0.85">BEEONIA</text>
  <circle cx="400" cy="235" r="10" fill="#9a7a20" stroke="#fff8e0" stroke-width="0.5"/>
  <text x="400" y="239" text-anchor="middle" fill="#f0c040" font-size="12">&#x1F41D;</text>

  <!-- === LABEL === -->
  <!-- Label background with curved shape following jar -->
  <path d="M258,380 Q255,390 256,460 Q257,530 262,550
           Q290,558 400,560 Q510,558 538,550
           Q543,530 544,460 Q545,390 542,380
           Q510,372 400,370 Q290,372 258,380 Z"
        fill="url(#labelGrad)" opacity="0.92"/>

  <!-- Geometric diamond pattern on label -->
  <g opacity="0.12" clip-path="url(#labelClip)">
    <polygon points="400,380 440,420 400,460 360,420" fill="none" stroke="#d4a84b" stroke-width="0.8"/>
    <polygon points="400,365 455,420 400,475 345,420" fill="none" stroke="#d4a84b" stroke-width="0.5"/>
    <polygon points="400,350 470,420 400,490 330,420" fill="none" stroke="#d4a84b" stroke-width="0.3"/>
    <polygon points="300,380 340,420 300,460 260,420" fill="none" stroke="#d4a84b" stroke-width="0.6"/>
    <polygon points="500,380 540,420 500,460 460,420" fill="none" stroke="#d4a84b" stroke-width="0.6"/>
    <polygon points="300,400 330,430 300,460 270,430" fill="none" stroke="#d4a84b" stroke-width="0.4"/>
    <polygon points="500,400 530,430 500,460 470,430" fill="none" stroke="#d4a84b" stroke-width="0.4"/>
    <line x1="240" y1="420" x2="560" y2="420" stroke="#d4a84b" stroke-width="0.3"/>
    <line x1="240" y1="440" x2="560" y2="440" stroke="#d4a84b" stroke-width="0.2"/>
    <line x1="350" y1="370" x2="350" y2="560" stroke="#d4a84b" stroke-width="0.2"/>
    <line x1="450" y1="370" x2="450" y2="560" stroke="#d4a84b" stroke-width="0.2"/>
  </g>

  <!-- Label edge highlights -->
  <path d="M270,382 Q400,372 530,382" fill="none" stroke="rgba(212,168,75,0.25)" stroke-width="0.8"/>
  <path d="M270,548 Q400,558 530,548" fill="none" stroke="rgba(212,168,75,0.15)" stroke-width="0.8"/>

  <!-- === LABEL TEXT === -->
  <!-- Product name - large, two lines -->
  <text x="400" y="430" text-anchor="middle" fill="#d4a84b" font-family="'Cinzel', 'Times New Roman', serif" font-size="48" font-weight="bold" letter-spacing="3">ARI SUTU</text>
  <text x="400" y="455" text-anchor="middle" fill="#e8c86a" font-family="'Cormorant Garamond', 'Georgia', serif" font-size="16" letter-spacing="2" font-style="italic">Royal Jelly</text>

  <!-- Subtitle -->
  <text x="400" y="480" text-anchor="middle" fill="#c0a050" font-family="'Cormorant Garamond', 'Georgia', serif" font-size="14" letter-spacing="1">Premium Quality - Vitality Booster</text>

  <!-- Thin separator line -->
  <line x1="320" y1="493" x2="480" y2="493" stroke="#d4a84b" stroke-width="0.5" opacity="0.4"/>

  <!-- Origin text -->
  <text x="400" y="512" text-anchor="middle" fill="#b09040" font-family="'Cormorant Garamond', 'Georgia', serif" font-size="13" letter-spacing="0.5" opacity="0.8">Yamanlar Mountain, Izmir</text>

  <!-- Ingredient tags at bottom -->
  <g transform="translate(400,540)">
    <text x="-60" y="0" text-anchor="middle" fill="#d4a84b" font-family="'Montserrat', sans-serif" font-size="9" letter-spacing="2">ROYAL JELLY</text>
    <circle cx="0" cy="-3" r="1.5" fill="#d4a84b"/>
    <text x="55" y="0" text-anchor="middle" fill="#d4a84b" font-family="'Montserrat', sans-serif" font-size="9" letter-spacing="2">NATURAL</text>
  </g>

  <!-- === SPARKLE ELEMENT === -->
  <g transform="translate(680,680)" filter="url(#glow)">
    <line x1="0" y1="-12" x2="0" y2="12" stroke="rgba(230,210,170,0.8)" stroke-width="1.5"/>
    <line x1="-12" y1="0" x2="12" y2="0" stroke="rgba(230,210,170,0.8)" stroke-width="1.5"/>
    <line x1="-6" y1="-6" x2="6" y2="6" stroke="rgba(230,210,170,0.5)" stroke-width="1"/>
    <line x1="6" y1="-6" x2="-6" y2="6" stroke="rgba(230,210,170,0.5)" stroke-width="1"/>
  </g>
  <!-- Small secondary sparkle -->
  <g transform="translate(650,640)" filter="url(#glow)" opacity="0.4">
    <line x1="0" y1="-5" x2="0" y2="5" stroke="rgba(230,210,170,0.6)" stroke-width="1"/>
    <line x1="-5" y1="0" x2="5" y2="0" stroke="rgba(230,210,170,0.6)" stroke-width="1"/>
  </g>

  <!-- Ambient light reflection on glass -->
  <ellipse cx="370" cy="310" rx="30" ry="8" fill="rgba(255,255,255,0.08)" transform="rotate(-5,370,310)"/>
</svg>